name: Build SkidCount APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SkidCount_Android_Source*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract SkidCount project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -name 'SkidCount_Android_Source*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p "$PROJECT_DIR" assembleRelease --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" \
             output/SkidCount-v0.1-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkidCount-APK
          path: output/SkidCount-v0.1-release.apk
          if-no-files-found: error
          retention-days: 30
